<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動画GIF作成</title>
<style>
  :root {
    --bg:#f2f4f8; --card:#fff; --text:#111827; --sub:#6b7280; --accent:#2563eb;
    --accent-soft:rgba(37,99,235,.14); --warn:#b45309; --err:#b91c1c; --line:#d8dde6; --rail:#e3e7ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --card:#1b1f27; --text:#f1f3f7; --sub:#9aa3b2; --accent:#4c8dff;
      --accent-soft:rgba(76,141,255,.22); --warn:#f0b24a; --err:#ff7a7a; --line:#303642; --rail:#2a303b;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { color-scheme: light dark; }
  /* 長押しで、文字が選択されたり、メニューが出たりしないようにする(完成した画像の長押し保存は、そのまま使える) */
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Noto Sans JP",sans-serif; font-size:15px;
         -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #out { -webkit-user-select:auto; user-select:auto; -webkit-touch-callout:default; }
  body.hasbar .page { padding-bottom:calc(88px + env(safe-area-inset-bottom, 0px)); }
  /* 左右の余白を広めにとる(Androidの、画面の端から内側へのスワイプ=「戻る」操作と、ぶつからないように) */
  .page { max-width:560px; margin:0 auto; padding:12px 24px 24px; }
  .hidden { display:none !important; }

  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; }
  .dots { display:flex; gap:5px; }
  .dot { width:18px; height:6px; border-radius:3px; background:var(--rail); }
  .dot.on { background:var(--accent); }

  h2 { font-size:13px; margin:16px 0 8px; color:var(--sub); font-weight:700; letter-spacing:.03em; }
  h2 small { font-weight:400; }
  .hint { font-size:13px; color:var(--sub); margin-top:6px; line-height:1.5; }
  .info { font-size:14px; line-height:1.6; }
  .warn { color:var(--warn); }
  .err { color:var(--err); }
  .divider { height:1px; background:var(--line); margin:14px 0; }

  button { font:inherit; color:var(--text); -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  .btn { min-height:48px; padding:0 16px; border:1px solid var(--line); border-radius:12px; background:var(--card); font-size:16px; font-weight:600; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn:disabled { opacity:.5; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1 1 0; }

  /* 1. 動画選択(画面のどこを押しても、選択が始まる。アイコンとボタンは中央) */
  .pick { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; min-height:calc(100vh - 90px);
          border:2px dashed var(--line); border-radius:18px; background:var(--card); text-align:center;
          padding:24px; cursor:pointer; }
  .pick .big { font-size:64px; line-height:1; }
  .pick .btn { display:flex; align-items:center; justify-content:center; width:100%; max-width:280px; min-height:56px; font-size:18px; }
  .pick input { display:none; }

  /* プレビュー(手順2〜5で上に固定) */
  .preview { position:sticky; top:0; z-index:10; background:var(--bg); padding:6px 0 10px; border-bottom:1px solid var(--line); }
  .stagewrap { display:flex; justify-content:center; }
  /* 長押しで、メニュー(動画のダウンロードなど)が出ないようにする */
  .stage { position:relative; background:#000; border-radius:10px; overflow:hidden;
           -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  .stage video { width:100%; height:100%; display:block; object-fit:fill; pointer-events:none; }
  .holdtag { position:absolute; top:8px; right:8px; padding:4px 10px; border-radius:14px; background:rgba(0,0,0,.65); color:#fff;
             font-size:13px; font-weight:700; pointer-events:none; }
  .times { display:flex; justify-content:space-between; align-items:center; gap:8px; font-variant-numeric:tabular-nums; font-size:14px; color:var(--sub); margin-top:6px; }
  .mini { min-height:40px; min-width:96px; padding:0 14px; border-radius:20px; border:1px solid var(--accent); background:var(--card);
          font-size:15px; font-weight:700; color:var(--accent); }
  .mini.on { background:var(--accent); color:#fff; }
  .rate { display:grid; grid-template-columns:repeat(5, 1fr); gap:5px; margin-top:6px; }
  .rate .chip { min-height:34px; padding:0 2px; font-size:12px; border-radius:17px; text-align:center; }

  /* 切り抜き枠(手順4。操作はプレビュー全体で受け付ける) */
  .crop { position:absolute; border:2px solid #fff; box-shadow:0 0 0 999px rgba(0,0,0,.55); pointer-events:none; }
  .stage.editing { touch-action:none; cursor:crosshair; }
  .stage.scrub { touch-action:pan-y; cursor:ew-resize; }
  .ch { position:absolute; width:44px; height:44px; pointer-events:none; }
  .ch::before { content:''; position:absolute; width:20px; height:20px; border:4px solid #fff; filter:drop-shadow(0 0 2px rgba(0,0,0,.8)); }
  .ch.nw { left:0; top:0; }      .ch.nw::before { left:2px; top:2px; border-right:0; border-bottom:0; }
  .ch.ne { right:0; top:0; }     .ch.ne::before { right:2px; top:2px; border-left:0; border-bottom:0; }
  .ch.sw { left:0; bottom:0; }   .ch.sw::before { left:2px; bottom:2px; border-right:0; border-top:0; }
  .ch.se { right:0; bottom:0; }  .ch.se::before { right:2px; bottom:2px; border-left:0; border-top:0; }

  /* タイムライン */
  .tl { position:relative; padding-top:30px; touch-action:none; user-select:none; -webkit-user-select:none; }
  .band { position:relative; height:56px; margin:0 40px; }
  .rail { position:absolute; inset:0; background:var(--rail); border-radius:10px; }
  .sel { position:absolute; top:0; bottom:0; border-top:4px solid var(--accent); border-bottom:4px solid var(--accent); background:var(--accent-soft); z-index:1; }
  .hdl { position:absolute; top:0; bottom:0; width:24px; background:var(--accent); color:#fff; display:flex; align-items:center;
         justify-content:center; font-weight:800; font-size:22px; z-index:2; touch-action:none; }
  .hdl::after { content:''; position:absolute; top:-6px; bottom:-6px; left:-8px; right:-8px; }
  .hdl.hs { transform:translateX(-100%); border-radius:10px 0 0 10px; }
  .hdl.he { border-radius:0 10px 10px 0; }
  .ph { position:absolute; top:-28px; bottom:-4px; width:0; z-index:3; pointer-events:none; }
  .ph::before { content:''; position:absolute; left:-1.5px; width:3px; top:22px; bottom:0; background:var(--text); border-radius:2px; }
  .knob { position:absolute; left:-13px; top:0; width:26px; height:26px; border-radius:50%; background:var(--text);
          border:3px solid var(--card); pointer-events:auto; touch-action:none; }
  .knob::after { content:''; position:absolute; inset:-10px; }

  .rangeinfo { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:14px; margin-top:10px; font-variant-numeric:tabular-nums; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { min-height:44px; padding:0 14px; border-radius:22px; border:1px solid var(--line); background:var(--card); font-size:15px; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  .grid { display:grid; gap:6px; }
  .grid .chip { padding:0 2px; font-size:14px; text-align:center; border-radius:12px; }
  .g4 { grid-template-columns:repeat(4, 1fr); }
  .g3 { grid-template-columns:repeat(3, 1fr); }
  .center { justify-content:center; }
  .ctitle { text-align:center; }
  .ratiochips { display:flex; flex-wrap:wrap; gap:6px; }
  .ratiochips .chip { min-height:40px; padding:0 14px; font-size:14px; border-radius:20px; }
  .step4 { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:10px; }
  .step4 .btn { min-height:44px; padding:0 2px; font-size:15px; }
  .setrow { display:flex; gap:8px; margin-top:10px; }
  .setrow .btn { flex:1 1 0; min-height:44px; padding:0 8px; font-size:14px; }
  #trimMsg { font-size:13px; margin-top:6px; }
  .summary { margin-top:14px; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--card); font-size:14px; line-height:1.7; }

  /* 速度スライダー(つまみは、縦長の「|」) */
  .slider { -webkit-appearance:none; appearance:none; flex:1 1 auto; min-width:0; height:44px; margin:0; background:transparent; }
  .slider::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:var(--rail); }
  .slider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:12px; height:40px; margin-top:-17px; border-radius:6px;
                                  background:var(--accent); border:2px solid var(--card); box-shadow:0 0 0 1px var(--accent); }
  .slider::-moz-range-track { height:6px; border-radius:3px; background:var(--rail); }
  .slider::-moz-range-thumb { width:8px; height:36px; border-radius:6px; background:var(--accent); border:2px solid var(--card); }
  .sliderrow { display:flex; align-items:center; gap:8px; margin-top:4px; }
  .sliderrow .btn { min-height:44px; min-width:44px; padding:0; font-size:20px; }
  .sliderlabel { display:flex; justify-content:space-between; font-size:14px; }
  .sliderlabel b { font-size:18px; }
  .ticks { position:relative; height:16px; margin:0 52px; font-size:11px; color:var(--sub); }
  .ticks span { position:absolute; transform:translateX(-50%); }

  /* 完成 */
  #out { width:100%; height:auto; display:block; border-radius:10px; border:1px solid var(--line); background:#000; }

  /* 下部バー */
  .bar { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--card); border-top:1px solid var(--line);
         padding:10px 24px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .bar .inner { max-width:560px; margin:0 auto; display:flex; gap:10px; }
  .bar .inner > * { flex:1 1 0; }

  /* 生成中 */
  .busy { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:24px; }
  .busy .box { width:100%; max-width:420px; background:var(--card); border-radius:16px; padding:20px; }
  .busy .t { font-size:16px; font-weight:700; margin-bottom:12px; }
  progress { width:100%; height:14px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>動画GIF作成</h1>
    <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </header>

  <!-- 1. 動画を選ぶ(画面全体がボタン) -->
  <section id="s1">
    <label class="pick" for="file">
      <div class="big">🎞️</div>
      <span class="btn primary">動画を選ぶ</span>
      <div id="msg1" class="info"></div>
      <input type="file" id="file" accept="video/*">
    </label>
  </section>

  <!-- プレビュー(2〜5で共通。上に固定) -->
  <div class="preview hidden" id="previewArea">
    <div class="stagewrap" id="stagewrap">
      <div class="stage" id="stage">
        <video id="video" playsinline muted preload="auto"></video>
        <div class="holdtag hidden" id="holdTag">▶▶ ×2</div>
        <div class="crop hidden" id="crop">
          <div class="ch nw"></div><div class="ch ne"></div><div class="ch sw"></div><div class="ch se"></div>
        </div>
      </div>
    </div>
    <div class="times">
      <span id="curLabel">現在 0.00s</span>
      <button class="mini" id="playBtn">▶ 再生</button>
      <span id="durLabel">全体 0.00s</span>
    </div>
    <div class="rate" id="rateChips">
      <button class="chip" data-rate="0.25">×0.25</button>
      <button class="chip" data-rate="0.5">×0.5</button>
      <button class="chip on" data-rate="1">×1</button>
      <button class="chip" data-rate="2">×2</button>
      <button class="chip" data-rate="4">×4</button>
    </div>
  </div>

  <!-- 2. 範囲 -->
  <section id="s2" class="hidden">
    <div id="tlHost2">
      <!-- タイムライン(手順2と最終確認で共用。表示する画面へ移動します) -->
      <div id="tlBlock">
        <div class="tl" id="tl">
          <div class="band" id="band">
            <div class="rail"></div>
            <div class="sel" id="sel"></div>
            <div class="hdl hs" id="hs" data-role="start"><span>[</span></div>
            <div class="hdl he" id="he" data-role="end"><span>]</span></div>
            <div class="ph" id="ph"><div class="knob" data-role="play"></div></div>
          </div>
        </div>
        <div class="rangeinfo">
          <span>開始 <b id="startLabel">0.00s</b></span>
          <span>終了 <b id="endLabel">0.00s</b></span>
          <span>長さ <b id="lenLabel">0.00s</b></span>
        </div>
        <div class="setrow">
          <button class="btn" id="setStart">現在位置を開始に</button>
          <button class="btn" id="setEnd">現在位置を終了に</button>
        </div>
        <div id="trimMsg" class="err"></div>
      </div>
    </div>

    <div class="step4">
      <button class="btn" id="prev10">◀◀ -5</button>
      <button class="btn" id="prev">◀ -1</button>
      <button class="btn" id="next">+1 ▶</button>
      <button class="btn" id="next10">+5 ▶▶</button>
    </div>
    <h2 class="ctitle">コマ送りの対象</h2>
    <div class="chips center" id="targetChips">
      <button class="chip" data-target="start">開始</button>
      <button class="chip on" data-target="play">現在</button>
      <button class="chip" data-target="end">終了</button>
    </div>
  </section>

  <!-- 3. 速度(プレビューは、常に出力と同じ速さで再生。プレビューを左右になぞっても、速度を変えられます) -->
  <section id="s3" class="hidden">
    <div id="speedHost3">
      <!-- 速度スライダー(手順3と最終確認で共用) -->
      <div id="speedBlock">
        <div class="sliderlabel"><span>遅い</span><b id="speedLabel">×1</b><span>速い</span></div>
        <div class="sliderrow">
          <button class="btn" id="speedDown" aria-label="遅くする">−</button>
          <input type="range" class="slider" id="speed" min="0" max="1000" step="1" value="624">
          <button class="btn" id="speedUp" aria-label="速くする">+</button>
        </div>
        <div class="ticks" id="speedTicks"></div>
      </div>
    </div>
    <div class="divider"></div>
    <div id="speedMsg" class="info"></div>
  </section>

  <!-- 4. 切り抜きと設定 -->
  <section id="s4" class="hidden">
    <h2 class="ctitle">切り抜き</h2>
    <div class="ratiochips center" id="ratioChips">
      <button class="chip" data-ratio="orig">元</button>
      <button class="chip" data-ratio="1:1">1:1</button>
      <button class="chip" data-ratio="4:3">4:3</button>
      <button class="chip" data-ratio="3:4">3:4</button>
      <button class="chip" data-ratio="16:9">16:9</button>
      <button class="chip" data-ratio="9:16">9:16</button>
    </div>
   <div id="optHost4">
    <!-- 出力設定(手順4と最終確認で共用) -->
    <div id="optBlock">
    <h2>画像サイズ <small>(長辺 px)</small></h2>
    <div class="grid g4" id="sizeChips">
      <button class="chip" data-size="s">小 320</button>
      <button class="chip on" data-size="m">中 480</button>
      <button class="chip" data-size="l">大 720</button>
      <button class="chip" data-size="o">原寸</button>
    </div>

    <h2>滑らかさ <small>(コマ/秒)</small></h2>
    <div class="grid g4" id="fpsChips">
      <button class="chip on" data-fps="30">30</button>
      <button class="chip" data-fps="20">20</button>
      <button class="chip" data-fps="15">15</button>
      <button class="chip" data-fps="10">10</button>
    </div>

    <h2>画質</h2>
    <div class="grid g3" id="qChips">
      <button class="chip" data-q="high">高</button>
      <button class="chip on" data-q="std">標準</button>
      <button class="chip" data-q="light">軽量</button>
    </div>
    </div>
   </div>

    <div class="summary" id="summary"></div>
  </section>

  <!-- 5. 最終確認 -->
  <section id="s5" class="hidden">
    <div id="tlHost5"></div>
    <div class="divider"></div>
    <div id="speedHost5"></div>
    <div class="divider"></div>
    <div id="optHost5"></div>
    <div class="summary" id="confirm"></div>
    <div id="msg5" class="info" style="margin-top:8px;"></div>
  </section>

  <!-- 6. 完成 -->
  <section id="s6" class="hidden">
    <img id="out" alt="生成したGIF">
    <div class="hint" style="text-align:center;">画像を長押しして保存してください。<br><span id="sizeLabel"></span></div>
    <div id="resMsg" class="info" style="margin-top:8px;"></div>
  </section>
</div>

<div class="bar hidden" id="bar2">
  <div class="inner">
    <button class="btn" id="back1">動画を選び直す</button>
    <button class="btn primary" id="next2">次へ(速度)</button>
  </div>
</div>
<div class="bar hidden" id="bar3">
  <div class="inner">
    <button class="btn" id="back2">戻る</button>
    <button class="btn primary" id="next3">次へ(切り抜き)</button>
  </div>
</div>
<div class="bar hidden" id="bar4">
  <div class="inner">
    <button class="btn" id="back3">戻る</button>
    <button class="btn primary" id="next4">次へ(最終確認)</button>
  </div>
</div>
<div class="bar hidden" id="bar5">
  <div class="inner">
    <button class="btn" id="back4">戻る</button>
    <button class="btn primary" id="gen">GIFを生成</button>
  </div>
</div>
<div class="bar hidden" id="bar6">
  <div class="inner">
    <button class="btn" id="backEdit">最終確認に戻る</button>
    <button class="btn primary" id="again">別の動画で作る</button>
  </div>
</div>

<div class="busy hidden" id="busy">
  <div class="box">
    <div class="t">GIFを生成中</div>
    <progress id="prog" value="0" max="100"></progress>
    <div id="status" class="info" style="margin-top:10px;"></div>
    <div class="hint">画面を消したり、別の画面へ切り替えたりしないでください。</div>
  </div>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script>
(function () {
  var STEP_FPS = 30;              // プレビューのコマ送りの刻み
  var MIN_LEN = 1 / STEP_FPS;
  var WARN_SEC = 10;
  var PLAY_RATE = 0.5;            // 取り込み時の再生速度
  var MIN_CROP = 24;              // 切り抜き枠の最小(元動画の画素)
  var MAX_SIDE = 1920;
  var MEM_WARN = 200e6;
  var WORKER_URL = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
  var RATIOS = { '1:1': 1, '4:3': 4 / 3, '3:4': 3 / 4, '16:9': 16 / 9, '9:16': 9 / 16 };
  var SIZES = { s: 320, m: 480, l: 720 };
  var QUALITY = { high: 1, std: 10, light: 20 };   // gif.js: 小さいほど高画質で遅い
  var SPEED_MIN = 0.1, SPEED_MAX = 4, SPEED_STEP = 0.05;
  var SCRUB_PX = 7;             // プレビューを横になぞったとき、1コマ進めるのに必要な距離(px)
  var SPEED_SWIPE = 1.5;           // 速度の画面で、プレビューを横になぞったとき、1pxあたりに動くスライダー量(全体は1000)

  // 手順の番号: 1=動画 2=範囲 3=速度 4=切り抜き・設定 5=最終確認 6=完成
  var $ = function (id) { return document.getElementById(id); };
  var video = $('video'), canvas = $('canvas'), band = $('band'), cropEl = $('crop'), stageEl = $('stage');
  var startT = 0, endT = 0, curT = 0, duration = 0, vw = 0, vh = 0;
  var crop = { x: 0, y: 0, w: 1, h: 1 };          // 切り抜き(元動画の画素)。常に自由に変えられる
  var ratioKey = null;                            // 比率ボタンの選択(枠を整えるだけ。そのあとも自由に動かせる)
  var sizeKey = 'm', fpsVal = 30, qualityKey = 'std', speed = 1, target = 'play';
  var videoUrl = null, resultUrl = null, workerBlobUrl = null, busy = false, stepNo = 1;
  var drag = null, cdrag = null, scrub = null, playing = false, playRaf = 0;
  var prevRate = '1';             // 範囲・切り抜きの画面での、仮再生の速さ
  var seekWant = null, renderQueued = false;
  var holdBoost = false, holdTimer = null;   // プレビューの長押し中だけ、再生を2倍にする
  var HOLD_MS = 350;

  function fmt(t) { return t.toFixed(2) + 's'; }
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  // ---- 画面(ステップ)切り替え ----
  function show(n) {
    stopPlay();
    stepNo = n;
    for (var k = 1; k <= 6; k++) $('s' + k).classList.toggle('hidden', k !== n);
    $('previewArea').classList.toggle('hidden', n < 2 || n > 5);
    // 「確認の速さ」は、範囲と切り抜きの画面だけ。速度と最終確認では、常に出力と同じ速さで再生する
    $('rateChips').classList.toggle('hidden', !(n === 2 || n === 4));
    for (var b = 2; b <= 6; b++) $('bar' + b).classList.toggle('hidden', b !== n);
    document.body.classList.toggle('hasbar', n >= 2);
    var dots = document.querySelectorAll('.dot');
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i < n);
    // 共用の部品は、表示する画面へ移動する
    if (n === 5) {
      $('tlHost5').appendChild($('tlBlock'));
      $('speedHost5').appendChild($('speedBlock'));
      $('optHost5').appendChild($('optBlock'));
    } else {
      if (n === 2) $('tlHost2').appendChild($('tlBlock'));
      if (n === 3) $('speedHost3').appendChild($('speedBlock'));
      if (n === 4) $('optHost4').appendChild($('optBlock'));
    }
    window.scrollTo(0, 0);
    applyViewMode();
    if (n >= 3 && n <= 5) {
      video.currentTime = startT;   // 開始位置の絵から、速度・切り抜き・最終確認をする
      curT = startT;
    }
    if (n >= 2 && n <= 5) { render(); updateCropUI(); }
  }

  // ---- 動画読み込み ----
  $('file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f || busy) return;
    if (videoUrl) URL.revokeObjectURL(videoUrl);
    videoUrl = URL.createObjectURL(f);
    $('msg1').textContent = '読み込み中...';
    video.src = videoUrl;
    video.load();
    e.target.value = '';
  });

  video.addEventListener('loadedmetadata', function () {
    duration = video.duration;
    vw = video.videoWidth;
    vh = video.videoHeight;
    startT = 0;
    endT = duration;
    rangeLen = duration;
    curT = 0;
    crop = { x: 0, y: 0, w: vw, h: vh };
    ratioKey = null; setChipOn('ratioChips', 'ratio', '');
    sizeKey = 'm'; fpsVal = 30; qualityKey = 'std'; target = 'play';
    speed = 1;
    $('speed').value = speedToPos(1);
    $('speedLabel').textContent = '×' + speed;
    $('msg1').textContent = '';
    $('msg5').textContent = '';
    $('durLabel').textContent = '全体 ' + fmt(duration);
    setChipOn('sizeChips', 'size', 'm');
    setChipOn('fpsChips', 'fps', '30');
    setChipOn('qChips', 'q', 'std');
    setChipOn('targetChips', 'target', 'play');
    show(2);
  });

  video.addEventListener('error', function () {
    if (!video.getAttribute('src')) return;
    $('msg1').innerHTML = '<span class="err">この動画を読み込めませんでした。別の形式でお試しください。</span>';
    show(1);
  });

  video.addEventListener('seeked', function () {
    if (seekWant !== null) { flushSeek(); return; }   // 待たせていた最新の位置へ進める
    if (drag || busy || playing || scrub) return;
    curT = video.currentTime;
    if (stepNo >= 2 && stepNo <= 5) render();
  });

  // ---- プレビューの表示 ----
  // 切り抜きの画面では「全体」を表示し、切り抜き枠を操作できる。
  // それ以外の画面では、切り抜いた範囲を、プレビューいっぱいに表示する。
  function fullView() { return stepNo === 4; }
  function applyViewMode() {
    var full = fullView();
    stageEl.classList.toggle('editing', full);
    // 範囲・速度・最終確認では、プレビューを左右になぞれる(縦のスクロールだけブラウザに任せ、横の動きは途切れさせない)
    stageEl.classList.toggle('scrub', stepNo === 2 || stepNo === 3 || stepNo === 5);
    cropEl.classList.toggle('hidden', !full);
    layoutStage();
  }
  function layoutStage() {
    if (!vw || !vh || stepNo < 2 || stepNo > 5) return;
    var full = fullView();
    var aw = full ? vw : crop.w, ah = full ? vh : crop.h;
    var avail = ($('stagewrap').clientWidth || 300) - 24;   // プレビューの左右にも余白をとる(端のスワイプ対策)
    var maxH = window.innerHeight * (full ? 0.32 : 0.38);
    var w = Math.min(avail, maxH * (aw / ah));
    stageEl.style.width = w + 'px';
    stageEl.style.height = (w * ah / aw) + 'px';
    if (full) {
      video.style.cssText = '';
    } else {
      // 切り抜いた範囲だけが見えるように、動画を拡大して位置を合わせる
      var sc = w / crop.w;
      video.style.cssText = 'position:absolute;max-width:none;width:' + (vw * sc) + 'px;height:' + (vh * sc) + 'px;left:' +
        (-crop.x * sc) + 'px;top:' + (-crop.y * sc) + 'px;';
    }
  }
  window.addEventListener('resize', layoutStage);

  // ---- 画面の更新 ----
  function pct(t) { return duration ? t / duration * 100 : 0; }
  function render() {
    $('trimMsg').textContent = '';
    $('hs').style.left = pct(startT) + '%';
    $('he').style.left = pct(endT) + '%';
    $('sel').style.left = pct(startT) + '%';
    $('sel').style.width = (pct(endT) - pct(startT)) + '%';
    $('ph').style.left = pct(curT) + '%';
    var len = endT - startT, outLen = len / speed;
    $('curLabel').textContent = '現在 ' + fmt(curT);
    $('startLabel').textContent = fmt(startT);
    $('endLabel').textContent = fmt(endT);
    $('lenLabel').textContent = fmt(len);
    var est = Math.ceil(len / PLAY_RATE + 2);
    if (stepNo === 3) {
      var html = '出力されるGIFの長さ: <b>' + outLen.toFixed(1) + '秒</b>';
      if (outLen > WARN_SEC) {
        html += '<br><span class="warn">' + WARN_SEC + '秒を超えています。生成に時間がかかり、端末のメモリ不足で失敗する場合があります。</span>';
      }
      $('speedMsg').innerHTML = html;
    }
    if (stepNo === 5) renderConfirm(len, outLen, est);
  }

  // 最終確認: 生成する内容の一覧
  function renderConfirm(len, outLen, est) {
    var d = outDims(), n = frameCount();
    var html = [
      '範囲 <b>' + fmt(startT) + ' 〜 ' + fmt(endT) + '</b>(' + fmt(len) + ')',
      '速度 <b>×' + speed + '</b> → 出力の長さ <b>' + outLen.toFixed(1) + '秒</b>',
      '切り抜き <b>' + Math.round(crop.w) + '×' + Math.round(crop.h) + '</b>(元動画の画素)',
      '出力サイズ <b>' + d[0] + '×' + d[1] + ' px</b>',
      '滑らかさ <b>' + fpsVal + 'コマ/秒</b>(' + n + 'コマ)',
      '画質 <b>' + { high: '高', std: '標準', light: '軽量' }[qualityKey] + '</b>',
      '<span style="color:var(--sub)">生成にかかる時間の目安: 約' + est + '秒</span>'
    ].join('<br>');
    if (outLen > WARN_SEC) {
      html += '<br><span class="warn">' + WARN_SEC + '秒を超えています。生成に時間がかかり、端末のメモリ不足で失敗する場合があります。</span>';
    }
    if (d[0] * d[1] * 4 * n > MEM_WARN) {
      html += '<br><span class="warn">コマ数×画素数が多く、メモリ不足で失敗する可能性があります。</span>';
    }
    $('confirm').innerHTML = html;
  }

  // なぞり・ドラッグ中は、シークを出しっぱなしにせず「前のシークが終わってから、最新の位置へ」出す。
  // (出しっぱなしだと、前のシークが取り消され続けて、絵が更新されずカクつく)
  function requestSeek(t) {
    seekWant = t;
    if (!video.seeking) flushSeek();
  }
  function flushSeek() {
    if (seekWant === null) return;
    var t = seekWant;
    seekWant = null;
    video.currentTime = t;
  }
  // 画面の更新は、描画のタイミングにまとめる(指の動きごとに全部作り直さない)
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(function () { renderQueued = false; render(); });
  }
  function seekVideo(t) {
    curT = t;
    requestSeek(t);
    scheduleRender();
  }

  // 開始位置を動かす。終了を超えるときは、終了も一緒に後ろへ動かす(範囲の長さは保つ)
  var rangeLen = 0;   // 押し出しのときに保つ、範囲の長さ
  function setStartT(t) {
    var s = clamp(t, 0, duration - MIN_LEN);
    if (s > endT - MIN_LEN) {
      endT = Math.min(duration, s + Math.max(MIN_LEN, rangeLen));
      s = Math.min(s, endT - MIN_LEN);
    }
    startT = s;
    if (endT - startT >= rangeLen || endT < duration) rangeLen = Math.max(MIN_LEN, endT - startT);
  }
  // role: play / start / end の位置を変更し、その位置をプレビューに出す
  function applyPos(role, t) {
    if (role === 'start') {
      setStartT(t);
      seekVideo(startT);
    } else if (role === 'end') {
      endT = clamp(t, startT + MIN_LEN, duration);
      rangeLen = endT - startT;
      seekVideo(endT);
    } else {
      seekVideo(clamp(t, 0, duration));
    }
  }
  function markerT(role) { return role === 'start' ? startT : role === 'end' ? endT : curT; }

  function setChipOn(boxId, attr, val) {
    var chips = $(boxId).querySelectorAll('.chip');
    for (var i = 0; i < chips.length; i++) chips[i].classList.toggle('on', chips[i].getAttribute('data-' + attr) === val);
  }
  function setTarget(role) {
    target = role;
    setChipOn('targetChips', 'target', role);
  }
  $('targetChips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (c) setTarget(c.getAttribute('data-target'));
  });

  // ---- タイムライン操作(つまんでスライド) ----
  function xToT(x) {
    var r = band.getBoundingClientRect();
    return clamp((x - r.left) / r.width, 0, 1) * duration;
  }
  var tl = $('tl');
  tl.addEventListener('pointerdown', function (e) {
    if (busy || !duration) return;
    e.preventDefault();
    stopPlay();
    var el = e.target.closest('[data-role]');
    var role = el ? el.getAttribute('data-role') : 'play';
    var t = xToT(e.clientX);
    // つかんだ位置と目印のずれを保ち、触れた瞬間に目印が跳ばないようにする
    var off = el ? t - markerT(role) : 0;
    drag = { role: role, off: off };
    setTarget(role);
    try { tl.setPointerCapture(e.pointerId); } catch (err) {}
    applyPos(role, t - off);
  });
  tl.addEventListener('pointermove', function (e) {
    if (!drag) return;
    e.preventDefault();
    applyPos(drag.role, xToT(e.clientX) - drag.off);
  });
  function endDrag() { drag = null; }
  tl.addEventListener('pointerup', endDrag);
  tl.addEventListener('pointercancel', endDrag);

  // ---- コマ送り(長押しで連続・加速) ----
  function stepTarget(d) { applyPos(target, markerT(target) + d / STEP_FPS); }
  // ボタンの長押しで、fn を連続実行する(長く押すほど速くなる)
  function bindRepeat(btn, fn, stopsPlay) {
    var timer = null, t0 = 0;
    function tick() {
      fn();
      var held = Date.now() - t0;
      timer = setTimeout(tick, held < 1200 ? 140 : held < 2500 ? 70 : 35);
    }
    function stop() { clearTimeout(timer); timer = null; }
    btn.addEventListener('pointerdown', function (e) {
      if (busy) return;
      e.preventDefault();
      if (stopsPlay) stopPlay();
      stop();
      t0 = Date.now();
      fn();
      timer = setTimeout(tick, 400);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { btn.addEventListener(ev, stop); });
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  bindRepeat($('prev10'), function () { stepTarget(-5); }, true);
  bindRepeat($('prev'), function () { stepTarget(-1); }, true);
  bindRepeat($('next'), function () { stepTarget(1); }, true);
  bindRepeat($('next10'), function () { stepTarget(5); }, true);

  // ---- 現在位置を開始・終了にする ----
  $('setStart').addEventListener('click', function () {
    if (busy) return;
    stopPlay();
    setStartT(curT);   // 終了を超える場合は、終了も後ろへ動かす
    render();
  });
  $('setEnd').addEventListener('click', function () {
    if (busy) return;
    stopPlay();
    if (curT <= startT + MIN_LEN) {
      $('trimMsg').textContent = '終了は、開始より後の位置にしてください。';
      return;
    }
    endT = curT;
    rangeLen = endT - startT;
    render();
  });

  // ---- 再生速度(0.1〜4倍。遅い側ほど細かく動くスライダー) ----
  function speedToPos(s) { return Math.round(Math.log(s / SPEED_MIN) / Math.log(SPEED_MAX / SPEED_MIN) * 1000); }
  function posToSpeed(v) {
    var s = SPEED_MIN * Math.pow(SPEED_MAX / SPEED_MIN, clamp(v, 0, 1000) / 1000);
    return Math.round(s / SPEED_STEP) * SPEED_STEP;
  }
  function setSpeed(s) {
    speed = clamp(Math.round(s * 100) / 100, SPEED_MIN, SPEED_MAX);
    $('speed').value = speedToPos(speed);
    $('speedLabel').textContent = '×' + speed;
    if (playing) video.playbackRate = playRate();
    render();
  }
  $('speed').addEventListener('input', function () { setSpeed(posToSpeed(parseInt($('speed').value, 10))); });
  bindRepeat($('speedDown'), function () { setSpeed(speed - SPEED_STEP); }, false);
  bindRepeat($('speedUp'), function () { setSpeed(speed + SPEED_STEP); }, false);
  [0.1, 0.25, 0.5, 1, 2, 4].forEach(function (v) {   // 目盛りは、スライダー上の位置に合わせて並べる
    var span = document.createElement('span');
    span.textContent = v;
    span.style.left = (speedToPos(v) / 10) + '%';
    $('speedTicks').appendChild(span);
  });

  // ---- 範囲の仮再生(開始〜終了を繰り返す) ----
  // 速度・最終確認の画面は、常に出力と同じ速さ。範囲・切り抜きの画面だけ、「確認の速さ」を選べる
  function playRate() {
    if (holdBoost) return 2;   // 長押し中は、元の動画の2倍(ほかの速度の設定とは無関係)
    return (stepNo === 3 || stepNo === 5) ? speed : parseFloat(prevRate);
  }
  $('rateChips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (!c) return;
    prevRate = c.getAttribute('data-rate');
    setChipOn('rateChips', 'rate', prevRate);
    if (playing) video.playbackRate = playRate();
  });
  function updatePlayhead() {
    $('ph').style.left = pct(curT) + '%';
    $('curLabel').textContent = '現在 ' + fmt(curT);
  }
  function playLoop() {
    if (!playing) return;
    if (video.currentTime >= endT || video.ended) {
      video.currentTime = startT;
      if (video.paused) { var p = video.play(); if (p && p.catch) p.catch(stopPlay); }
    }
    curT = video.currentTime;
    updatePlayhead();
    playRaf = requestAnimationFrame(playLoop);
  }
  function startPlay() {
    if (busy || !duration) return;
    var t0 = (curT >= startT && curT < endT - 0.05) ? curT : startT;   // 止めた位置から続ける
    video.currentTime = t0;
    video.playbackRate = playRate();
    var p = video.play();
    if (p && p.catch) p.catch(stopPlay);
    playing = true;
    $('playBtn').textContent = '■ 停止';
    $('playBtn').classList.add('on');
    playLoop();
  }
  function stopPlay() {
    if (!playing) return;
    playing = false;
    cancelAnimationFrame(playRaf);
    video.pause();
    video.playbackRate = 1;
    $('playBtn').textContent = '▶ 再生';
    $('playBtn').classList.remove('on');
    curT = video.currentTime;
    updatePlayhead();
  }
  function togglePlay() { if (playing) stopPlay(); else startPlay(); }
  $('playBtn').addEventListener('click', togglePlay);

  // ---- 手順4: 切り抜き・出力設定 ----
  function dimsFor(r, L) {
    var w, h;
    if (r >= 1) { w = L; h = L / r; } else { h = L; w = L * r; }
    return [Math.max(16, Math.round(w)), Math.max(16, Math.round(h))];
  }
  // 出力サイズ(切り抜き枠の比率のまま。元の解像度より大きくはしない)
  function outDims() {
    var r = crop.w / crop.h;
    var cap = Math.min(MAX_SIDE, Math.round(Math.max(crop.w, crop.h)));
    var L = sizeKey === 'o' ? cap : Math.min(SIZES[sizeKey], cap);
    return dimsFor(r, L);
  }
  function frameCount() { return Math.max(1, Math.floor((endT - startT) / speed * fpsVal)); }

  function updateCropUI() {
    cropEl.style.left = (crop.x / vw * 100) + '%';
    cropEl.style.top = (crop.y / vh * 100) + '%';
    cropEl.style.width = (crop.w / vw * 100) + '%';
    cropEl.style.height = (crop.h / vh * 100) + '%';
    var d = outDims(), n = frameCount(), outLen = (endT - startT) / speed;
    var html = '切り抜き <b>' + Math.round(crop.w) + '×' + Math.round(crop.h) + '</b> → 出力 <b>' + d[0] + '×' + d[1] + ' px</b><br>' +
      fpsVal + 'コマ/秒 ・ 速度 ×' + speed + ' ・ 長さ ' + outLen.toFixed(1) + '秒 ・ ' + n + 'コマ';
    if (d[0] * d[1] * 4 * n > MEM_WARN) {
      html += '<br><span class="warn">コマ数×画素数が多く、メモリ不足で失敗する可能性があります。</span>';
    }
    $('summary').innerHTML = html;
    if (stepNo === 5) render();   // 最終確認の一覧にも反映する
  }

  // 比率ボタンは「枠をその比率に整える」だけ。そのあとも、枠は自由にドラッグできる。「元」は、全体に戻す。
  function fitCropToRatio(r) {
    var cx = crop.x + crop.w / 2, cy = crop.y + crop.h / 2, w, h;
    if (vw / vh > r) { h = vh; w = vh * r; } else { w = vw; h = vw / r; }
    crop = { x: clamp(cx - w / 2, 0, vw - w), y: clamp(cy - h / 2, 0, vh - h), w: w, h: h };
  }
  $('ratioChips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (!c || busy) return;
    ratioKey = c.getAttribute('data-ratio');
    setChipOn('ratioChips', 'ratio', ratioKey);
    if (ratioKey === 'orig') crop = { x: 0, y: 0, w: vw, h: vh };
    else fitCropToRatio(RATIOS[ratioKey]);
    updateCropUI();
  });
  $('sizeChips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (!c || busy) return;
    sizeKey = c.getAttribute('data-size');
    setChipOn('sizeChips', 'size', sizeKey);
    updateCropUI();
  });
  $('fpsChips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (!c || busy) return;
    fpsVal = parseInt(c.getAttribute('data-fps'), 10);
    setChipOn('fpsChips', 'fps', String(fpsVal));
    updateCropUI();
  });
  $('qChips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (!c || busy) return;
    qualityKey = c.getAttribute('data-q');
    setChipOn('qChips', 'q', qualityKey);
    updateCropUI();
  });

  // ---- プレビューの操作 ----
  //  手順2      : 左右になぞってコマ送り / タップで再生・停止
  //  手順3      : 左右になぞって速度を変える(右=速く、左=遅く) / タップで再生・停止
  //  手順5      : 左右になぞってコマ送り(現在位置) / タップで再生・停止
  //  手順4      : 切り抜き(四隅=大きさ変更 / 辺=その辺だけ / 枠の中=移動 / 枠の外=なぞって新しく選ぶ。常に自由)、タップで再生・停止
  function stagePoint(e) {
    var r = stageEl.getBoundingClientRect();
    return { x: clamp((e.clientX - r.left) / r.width, 0, 1) * vw, y: clamp((e.clientY - r.top) / r.height, 0, 1) * vh, sc: r.width / vw };
  }
  // アンカー(固定する点)とポインタ位置から、枠を作る
  function rectFromAnchor(ax, ay, px, py) {
    var dirX = px >= ax ? 1 : -1, dirY = py >= ay ? 1 : -1;
    var maxW = dirX > 0 ? vw - ax : ax, maxH = dirY > 0 ? vh - ay : ay;
    var w = clamp(Math.abs(px - ax), MIN_CROP, maxW);
    var h = clamp(Math.abs(py - ay), MIN_CROP, maxH);
    return { x: dirX > 0 ? ax : ax - w, y: dirY > 0 ? ay : ay - h, w: w, h: h };
  }

  stageEl.addEventListener('pointerdown', function (e) {
    if (busy) return;
    if (!fullView()) {
      e.preventDefault();
      scrub = { x0: e.clientX, moved: false, t0: 0, pos0: 0, holding: false, wasPlaying: false };
      var mine = scrub;
      // 長押しの間だけ、2倍で再生する(再生中なら2倍に、停止中なら2倍で再生)
      // 速度の画面(手順3)では、長押しの2倍再生はしない(速度を確かめる画面のため)
      if (stepNo !== 3) holdTimer = setTimeout(function () {
        if (scrub !== mine || mine.moved) return;
        mine.holding = true;
        mine.wasPlaying = playing;
        holdBoost = true;
        $('holdTag').classList.remove('hidden');
        if (playing) video.playbackRate = playRate(); else startPlay();
      }, HOLD_MS);
      try { stageEl.setPointerCapture(e.pointerId); } catch (err) {}
      return;
    }
    e.preventDefault();
    var p = stagePoint(e), c = crop;
    var hit = 30 / p.sc;   // 触れた位置が「角・辺の近く」かどうかの範囲(画面上で約30px)
    var nearL = Math.abs(p.x - c.x) < hit, nearR = Math.abs(p.x - (c.x + c.w)) < hit;
    var nearT = Math.abs(p.y - c.y) < hit, nearB = Math.abs(p.y - (c.y + c.h)) < hit;
    var inX = p.x > c.x - hit && p.x < c.x + c.w + hit, inY = p.y > c.y - hit && p.y < c.y + c.h + hit;
    var inside = p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h;
    var full = c.w >= vw - 1 && c.h >= vh - 1;
    var d = { mode: 'draw', sx: p.x, sy: p.y, ax: p.x, ay: p.y, offX: 0, offY: 0, o: { x: c.x, y: c.y, w: c.w, h: c.h }, started: false, moved: false, px0: e.clientX, py0: e.clientY };
    if ((nearL || nearR) && (nearT || nearB)) {
      d.mode = 'corner';
      d.ax = nearR ? c.x : c.x + c.w;                       // 反対側の角を固定
      d.ay = nearB ? c.y : c.y + c.h;
      d.offX = p.x - (nearR ? c.x + c.w : c.x);              // つかんだ位置のずれ
      d.offY = p.y - (nearB ? c.y + c.h : c.y);
      d.started = true;
    } else if (inY && (nearL || nearR)) {
      d.mode = nearR ? 'e' : 'w'; d.started = true;
    } else if (inX && (nearT || nearB)) {
      d.mode = nearB ? 's' : 'n'; d.started = true;
    } else if (inside && !full) {
      d.mode = 'move'; d.started = true;
    }
    cdrag = d;
    try { stageEl.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stageEl.addEventListener('pointermove', function (e) {
    if (scrub) {
      if (scrub.holding) return;            // 長押し中は、なぞっても動かさない
      var dx0 = e.clientX - scrub.x0;
      if (!scrub.moved) {
        if (Math.abs(dx0) < 8) return;      // 触れただけ(タップ)では、動かさない
        scrub.moved = true;
        clearTimeout(holdTimer);
        if (stepNo === 2 || stepNo === 5) {
          // なぞり始めたら、再生を止めて、その位置から動かす(最終確認では、現在位置を動かす)
          stopPlay();
          scrub.role = stepNo === 2 ? target : 'play';
          scrub.t0 = markerT(scrub.role);
        } else {
          scrub.pos0 = speedToPos(speed);
        }
      }
      if (stepNo === 2 || stepNo === 5) applyPos(scrub.role, scrub.t0 + Math.round(dx0 / SCRUB_PX) / STEP_FPS);   // コマ送り・コマ戻し
      else if (stepNo === 3) setSpeed(posToSpeed(scrub.pos0 + dx0 * SPEED_SWIPE));   // 速度: 右=速く、左=遅く
      return;
    }
    if (!cdrag) return;
    e.preventDefault();
    var p = stagePoint(e), o = cdrag.o, m = cdrag.mode;
    if (!cdrag.moved && Math.abs(e.clientX - cdrag.px0) + Math.abs(e.clientY - cdrag.py0) >= 6) cdrag.moved = true;
    if (!cdrag.started) {
      // 触れただけ(タップ)では、枠を変えない
      if (!cdrag.moved) return;
      cdrag.started = true;
    }
    if (m !== 'move' && ratioKey) {
      // 大きさを変えたら、比率ボタンの選択は外す
      ratioKey = null;
      setChipOn('ratioChips', 'ratio', '');
    }
    if (m === 'move') {
      crop = { x: clamp(o.x + (p.x - cdrag.sx), 0, vw - o.w), y: clamp(o.y + (p.y - cdrag.sy), 0, vh - o.h), w: o.w, h: o.h };
    } else if (m === 'corner') {
      crop = rectFromAnchor(cdrag.ax, cdrag.ay, p.x - cdrag.offX, p.y - cdrag.offY);
    } else if (m === 'draw') {
      crop = rectFromAnchor(cdrag.ax, cdrag.ay, p.x, p.y);
    } else if (m === 'e') {
      crop = { x: o.x, y: o.y, w: clamp(p.x - o.x, MIN_CROP, vw - o.x), h: o.h };
    } else if (m === 'w') {
      var x2 = o.x + o.w, nx = clamp(p.x, 0, x2 - MIN_CROP);
      crop = { x: nx, y: o.y, w: x2 - nx, h: o.h };
    } else if (m === 's') {
      crop = { x: o.x, y: o.y, w: o.w, h: clamp(p.y - o.y, MIN_CROP, vh - o.y) };
    } else if (m === 'n') {
      var y2 = o.y + o.h, ny = clamp(p.y, 0, y2 - MIN_CROP);
      crop = { x: o.x, y: ny, w: o.w, h: y2 - ny };
    }
    updateCropUI();
  });
  // 長押しで出るメニュー(動画の保存、全選択など)を出さない。完成した画像だけは、長押しで保存できるように残す
  document.addEventListener('contextmenu', function (e) {
    if (e.target && e.target.id === 'out') return;
    e.preventDefault();
  });
  document.addEventListener('selectstart', function (e) {
    if (e.target && e.target.id === 'out') return;
    e.preventDefault();
  });
  // 指を離したとき: 動かしていなければ「タップ」として、再生・停止を切り替える
  // 長押しの2倍再生を終える(指を離したら、再生中でも停止中でも、止める)
  function endHold(s) {
    clearTimeout(holdTimer);
    if (!s || !s.holding) return false;
    holdBoost = false;
    $('holdTag').classList.add('hidden');
    stopPlay();
    return true;
  }
  stageEl.addEventListener('pointerup', function () {
    if (scrub) {
      var s = scrub;
      scrub = null;
      if (endHold(s)) return;               // 長押しだったときは、再生・停止の切り替えはしない
      if (!s.moved) togglePlay();
      return;
    }
    if (cdrag) {
      var tap2 = !cdrag.moved;
      cdrag = null;
      if (tap2) togglePlay();
    }
  });
  stageEl.addEventListener('pointercancel', function () { var s = scrub; scrub = null; cdrag = null; endHold(s); });

  // ---- GIF生成 ----
  function seekTo(t) {
    return new Promise(function (resolve) {
      if (Math.abs(video.currentTime - t) < 0.0005) { resolve(); return; }
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        video.removeEventListener('seeked', finish);
        resolve();
      }
      video.addEventListener('seeked', finish);
      setTimeout(finish, 3000);
      video.currentTime = t;
    });
  }

  // 一部のAndroidでは、シークしただけの動画をキャンバスに描くと真っ黒になる。
  // そのため範囲を低速で実際に再生し、届いたフレームを順に取り込む。
  // 出力 i コマ目には、元動画の時刻 startT + i*speed/fps 以前で最も新しいフレームを割り当てる。
  // c は元動画の切り抜き範囲(変形はせず、出力と同じ縦横比で切り取る)。
  function captureFrames(ctx, w, h, c, gif, n, fps, spd, onFrame) {
    return new Promise(function (resolve, reject) {
      var i = 0, prevCs = 0, haveFrame = false, firstBlack = false;
      var finished = false, lastCb = Date.now(), lastRaf = -1;
      var timer = null, useBitmap = false;

      function tAt(k) { return startT + k * spd / fps; }
      // GIFの遅延は1/100秒単位のため、平均が合うように 3,3,4 のように配分する
      function emit() {
        var cs = Math.round((i + 1) * 100 / fps);
        gif.addFrame(canvas, { copy: true, delay: (cs - prevCs) * 10 });
        prevCs = cs;
        i++;
        onFrame(i);
      }
      function onEnded() { end(); }
      function end(err) {
        if (finished) return;
        finished = true;
        clearInterval(timer);
        video.removeEventListener('ended', onEnded);
        video.pause();
        video.playbackRate = 1;
        if (err) { reject(err); return; }
        while (haveFrame && i < n) emit();
        resolve(firstBlack);
      }
      function handle(m) {
        lastCb = Date.now();
        // 新しいフレームが来る前の時刻分は、直前のフレームで確定させる
        while (haveFrame && i < n && tAt(i) < m) emit();
        drawFrame().then(function () {
          if (finished) return;
          if (i >= n || m >= endT) end(); else schedule();
        });
      }
      function drawDirect() {
        ctx.drawImage(video, c.x, c.y, c.w, c.h, 0, 0, w, h);
      }
      // 直接描画で空(黒)になる端末では、createImageBitmap経由に切り替える
      function drawBitmap() {
        return createImageBitmap(video).then(function (b) {
          ctx.drawImage(b, c.x, c.y, c.w, c.h, 0, 0, w, h);
          if (b.close) b.close();
        }, drawDirect);
      }
      function drawFrame() {
        if (useBitmap) return drawBitmap();
        drawDirect();
        if (haveFrame) return Promise.resolve();
        haveFrame = true;
        firstBlack = isBlack(ctx, w, h);
        if (!firstBlack || !window.createImageBitmap) return Promise.resolve();
        return drawBitmap().then(function () {
          if (!isBlack(ctx, w, h)) { useBitmap = true; firstBlack = false; }
        });
      }
      function schedule() {
        if (video.requestVideoFrameCallback) {
          video.requestVideoFrameCallback(function (now, meta) {
            if (!finished) handle(meta.mediaTime);
          });
        } else {
          requestAnimationFrame(function poll() {
            if (finished) return;
            var t = video.currentTime;
            if (t !== lastRaf) { lastRaf = t; handle(t); } else { requestAnimationFrame(poll); }
          });
        }
      }

      video.addEventListener('ended', onEnded);
      timer = setInterval(function () {
        if (Date.now() - lastCb > 8000) {
          end(new Error('動画のフレームを取得できません。再生が進んでいない可能性があります。'));
        }
      }, 1000);
      video.playbackRate = PLAY_RATE;
      schedule();
      var p = video.play();
      if (p && p.catch) p.catch(function (e) { end(e); });
    });
  }

  // 描画したフレームが完全に真っ黒かどうか(中央付近の一部をサンプリング)
  function isBlack(ctx, w, h) {
    try {
      var sw = Math.min(w, 64), sh = Math.min(h, 64);
      var d = ctx.getImageData(Math.floor((w - sw) / 2), Math.floor((h - sh) / 2), sw, sh).data;
      for (var i = 0; i < d.length; i += 4) {
        if (d[i] > 8 || d[i + 1] > 8 || d[i + 2] > 8) return false;
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  function getWorkerUrl() {
    if (workerBlobUrl) return Promise.resolve(workerBlobUrl);
    return fetch(WORKER_URL)
      .then(function (r) {
        if (!r.ok) throw new Error('worker取得失敗: ' + r.status);
        return r.text();
      })
      .then(function (code) {
        workerBlobUrl = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
        return workerBlobUrl;
      });
  }

  function setBusy(b) {
    busy = b;
    $('busy').classList.toggle('hidden', !b);
    ['gen', 'back1', 'back2', 'back3', 'back4', 'next2', 'next3', 'next4', 'backEdit', 'again',
     'playBtn', 'speed', 'speedDown', 'speedUp', 'setStart', 'setEnd'].forEach(function (id) { $(id).disabled = b; });
  }

  $('gen').addEventListener('click', function () {
    if (busy) return;
    stopPlay();
    $('msg5').textContent = '';
    if (endT - startT <= 0) {
      $('msg5').innerHTML = '<span class="err">開始と終了の範囲が不正です。</span>';
      return;
    }
    generate().catch(fail);
  });

  function fail(err) {
    var span = document.createElement('span');
    span.className = 'err';
    span.textContent = 'エラー: ' + (err && err.message ? err.message : err);
    $('msg5').textContent = '';
    show(5);
    $('msg5').appendChild(span);
    $('prog').value = 0;
    setBusy(false);
  }

  async function generate() {
    var d = outDims(), w = d[0], h = d[1];
    var fps = fpsVal, spd = speed;
    var c = { x: crop.x, y: crop.y, w: crop.w, h: crop.h };
    var n = frameCount();

    setBusy(true);
    var prog = $('prog');
    prog.value = 0;
    $('status').textContent = '準備中...';

    var workerUrl = await getWorkerUrl();
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext('2d');

    var gif = new GIF({
      workers: 2,
      quality: QUALITY[qualityKey],
      width: w,
      height: h,
      workerScript: workerUrl
    });

    await seekTo(startT);
    // 先頭が黒いだけなら暗い場面の可能性もあるため、中断せず続行して後で通知する
    var firstBlack = await captureFrames(ctx, w, h, c, gif, n, fps, spd, function (done) {
      prog.value = Math.round(done / n * 50);
      $('status').textContent = 'フレーム取得中 ' + done + ' / ' + n;
    });

    $('status').textContent = 'GIFにエンコード中...';

    // 進捗が一定時間止まったら失敗とみなす(Worker起動失敗などで固まるのを防ぐ)
    var watchdog = null;
    function arm() {
      clearTimeout(watchdog);
      watchdog = setTimeout(function () {
        try { gif.abort(); } catch (e) {}
        fail(new Error('エンコードが進みません。Workerが起動できていない可能性があります。'));
      }, 30000);
    }
    arm();
    gif.on('progress', function (p) {
      arm();
      prog.value = 50 + Math.round(p * 50);
    });
    gif.on('abort', function () { clearTimeout(watchdog); });
    gif.on('finished', function (blob) {
      clearTimeout(watchdog);
      if (resultUrl) URL.revokeObjectURL(resultUrl);
      resultUrl = URL.createObjectURL(blob);
      $('out').src = resultUrl;
      // 区切りのよい場所で改行されるように、項目ごとにまとめる
      var nw = function (s) { return '<span style="white-space:nowrap;">' + s + '</span>'; };
      $('sizeLabel').innerHTML = [nw(w + '×' + h + ' px'), nw(fps + 'コマ/秒'), nw('速度 ×' + spd),
        nw('約 ' + (blob.size / 1024 / 1024).toFixed(2) + ' MB')].join(' / ');
      $('resMsg').innerHTML = firstBlack
        ? '<span class="warn">先頭のフレームが真っ黒でした。動画のフレームを取得できていない可能性があります(Firefoxでは、フィンガープリント保護により取得できないことがあります。Chromeでお試しください)。</span>'
        : '';
      setBusy(false);
      show(6);
    });
    try {
      gif.render();
    } catch (e) {
      clearTimeout(watchdog);
      throw e;
    }
  }

  // ---- 画面下部のボタン ----
  function go(btnId, n) { $(btnId).addEventListener('click', function () { if (!busy) show(n); }); }
  go('back1', 1); go('next2', 3);
  go('back2', 2); go('next3', 4);
  go('back3', 3); go('next4', 5);
  go('back4', 4);
  go('backEdit', 5); go('again', 1);
})();
</script>
</body>
</html>
